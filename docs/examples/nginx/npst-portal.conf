# NPST Portal: one public entry point (EXAMPLE ONLY).
#
# Not used by the proof of concept, not tested against real services, and not
# syntax-checked. Before use: replace the <placeholders>, run `nginx -t`, and
# test every route. See docs/reverse-proxy.md.
#
# Layout:
#   /                      portal (shell) files
#   /apps/<app>/           application (MFE) files, e.g. /apps/sales/
#   /theme/                published theme (brand server)
#   /auth/                 authentication service (login, logout, current user)
#   /api/<service>/        backend APIs (only reachable through NGINX)

# WebSocket upgrades for the notification stream; empty for normal requests
# (keeps upstream keep-alive working).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Rate limits per client address.
limit_req_zone $binary_remote_addr zone=npst_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=npst_api:10m   rate=30r/s;

# Internal services. Passive health: a server failing 3 times in 30 s is
# skipped for 30 s (active health checks need NGINX Plus or external monitoring).
upstream npst_auth          { server <auth-service>:8080          max_fails=3 fail_timeout=30s; keepalive 16; }
upstream npst_platform      { server <platform-api>:8080          max_fails=3 fail_timeout=30s; keepalive 16; }
upstream npst_notifications { server <notification-service>:8080  max_fails=3 fail_timeout=30s; keepalive 16; }
upstream npst_sales         { server <sales-hub-api>:8080         max_fails=3 fail_timeout=30s; keepalive 16; }
upstream npst_projects      { server <delivery-api>:8080          max_fails=3 fail_timeout=30s; keepalive 16; }
upstream npst_hr            { server <hrms-api>:8080              max_fails=3 fail_timeout=30s; keepalive 16; }
upstream npst_brand         { server <brand-server>:8080          max_fails=3 fail_timeout=30s; }

server {
    listen 80;
    server_name <portal.npst.example>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <portal.npst.example>;

    # ---- TLS (certificate from the company CA) ----
    ssl_certificate     /etc/nginx/tls/<portal>.crt;
    ssl_certificate_key /etc/nginx/tls/<portal>.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # ---- Hardening ----
    server_tokens off;
    client_max_body_size  10m;
    client_header_timeout 15s;
    client_body_timeout   15s;
    keepalive_timeout     30s;

    # NOTE: `add_header` and `proxy_set_header` in a location REPLACE the ones
    # from the server level. That is why every location includes the snippets.
    include /etc/nginx/snippets/npst-security-headers.conf;

    root /srv/npst/shell;

    # ---- Portal (shell): single-page app ----
    location / {
        include /etc/nginx/snippets/npst-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Hashed portal files never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/npst-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- Applications (MFE files) ----
    # Files live in /srv/npst/apps/<app>/ (uses `root`, not `alias`).
    location /apps/ {
        root /srv/npst;
        include /etc/nginx/snippets/npst-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Entry files name the current hashed files: never cache them long,
    # or users keep an old version after a release (PROGRESS.md, Step 8).
    location ~ ^/apps/[a-z0-9-]+/(index\.html|mf-manifest\.json|remoteEntry\.js)$ {
        root /srv/npst;
        include /etc/nginx/snippets/npst-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---- Published theme (runtime branding) ----
    location /theme/ {
        include /etc/nginx/snippets/npst-proxy.conf;
        include /etc/nginx/snippets/npst-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        proxy_set_header X-User-Id "";
        proxy_pass http://npst_brand/;
    }

    # ---- Session check used by the API locations (internal only) ----
    # The authentication service answers 2xx (valid session) or 401.
    # Needs ngx_http_auth_request_module: check `nginx -V` for
    # --with-http_auth_request_module.
    location = /_npst_session {
        internal;
        proxy_pass http://npst_auth/session/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-User-Id "";
    }

    # ---- Authentication (login, logout, current user) ----
    location = /auth/login {
        limit_req zone=npst_login burst=5 nodelay;
        include /etc/nginx/snippets/npst-proxy.conf;
        include /etc/nginx/snippets/npst-security-headers.conf;
        proxy_set_header X-User-Id "";
        proxy_pass http://npst_auth/login;
    }

    location /auth/ {
        limit_req zone=npst_api burst=60 nodelay;
        include /etc/nginx/snippets/npst-proxy.conf;
        include /etc/nginx/snippets/npst-security-headers.conf;
        proxy_set_header X-User-Id "";
        proxy_pass http://npst_auth/;
    }

    # ---- Backend APIs: session checked here AND again by each backend ----
    location /api/platform/ {
        auth_request /_npst_session;
        auth_request_set $npst_user_id $upstream_http_x_user_id;
        limit_req zone=npst_api burst=60 nodelay;
        include /etc/nginx/snippets/npst-proxy.conf;
        include /etc/nginx/snippets/npst-security-headers.conf;
        proxy_set_header X-User-Id $npst_user_id;
        proxy_pass http://npst_platform/;
    }

    location /api/sales/ {
        auth_request /_npst_session;
        auth_request_set $npst_user_id $upstream_http_x_user_id;
        limit_req zone=npst_api burst=60 nodelay;
        include /etc/nginx/snippets/npst-proxy.conf;
        include /etc/nginx/snippets/npst-security-headers.conf;
        proxy_set_header X-User-Id $npst_user_id;
        proxy_pass http://npst_sales/;
    }

    location /api/projects/ {
        auth_request /_npst_session;
        auth_request_set $npst_user_id $upstream_http_x_user_id;
        limit_req zone=npst_api burst=60 nodelay;
        include /etc/nginx/snippets/npst-proxy.conf;
        include /etc/nginx/snippets/npst-security-headers.conf;
        proxy_set_header X-User-Id $npst_user_id;
        proxy_pass http://npst_projects/;
    }

    location /api/hr/ {
        auth_request /_npst_session;
        auth_request_set $npst_user_id $upstream_http_x_user_id;
        limit_req zone=npst_api burst=60 nodelay;
        include /etc/nginx/snippets/npst-proxy.conf;
        include /etc/nginx/snippets/npst-security-headers.conf;
        proxy_set_header X-User-Id $npst_user_id;
        proxy_pass http://npst_hr/;
    }

    # Notification inbox and actions.
    location /api/notifications/ {
        auth_request /_npst_session;
        auth_request_set $npst_user_id $upstream_http_x_user_id;
        limit_req zone=npst_api burst=60 nodelay;
        include /etc/nginx/snippets/npst-proxy.conf;
        include /etc/nginx/snippets/npst-security-headers.conf;
        proxy_set_header X-User-Id $npst_user_id;
        proxy_pass http://npst_notifications/;
    }

    # Live notification stream for the bell (server-sent events or WebSocket):
    # long-lived, unbuffered.
    location = /api/notifications/stream {
        auth_request /_npst_session;
        auth_request_set $npst_user_id $upstream_http_x_user_id;
        include /etc/nginx/snippets/npst-proxy.conf;
        include /etc/nginx/snippets/npst-security-headers.conf;
        proxy_set_header X-User-Id $npst_user_id;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://npst_notifications/stream;
    }

    # Anything else under /api/ does not exist.
    location /api/ {
        return 404;
    }

    # Basic metrics for monitoring, from the internal network only.
    location = /_nginx_status {
        stub_status;
        allow <monitoring-network>;
        deny all;
    }
}
