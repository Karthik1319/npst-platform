# Security headers for every response (EXAMPLE ONLY).
# Install as /etc/nginx/snippets/npst-security-headers.conf.
# Included in every location, because `add_header` in a location replaces
# the server-level ones.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "DENY" always;
# Content Security Policy: with the portal, applications and APIs on one
# origin, most sources can be 'self'. Define it with the application teams
# and test it in report-only mode first, e.g.:
# add_header Content-Security-Policy-Report-Only "default-src 'self'; frame-ancestors 'none'" always;
