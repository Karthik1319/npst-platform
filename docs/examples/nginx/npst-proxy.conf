# Proxy settings shared by every proxied location (EXAMPLE ONLY).
# Install as /etc/nginx/snippets/npst-proxy.conf.

proxy_http_version 1.1;

# Upgrade to WebSocket when asked; otherwise an empty Connection header keeps
# upstream keep-alive connections working.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host              $host;
# Overwrite (do not append) forwarding headers, so a client cannot pass
# a fake address through. If another load balancer sits in front of NGINX,
# use the realip module (set_real_ip_from) instead.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# One id per request, to follow it through all services' logs.
proxy_set_header X-Request-ID      $request_id;

# X-User-Id is NOT set here: every location sets it exactly once, either
# from the session check or to "" (dropped), so a client can never send it
# through to a backend.

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
