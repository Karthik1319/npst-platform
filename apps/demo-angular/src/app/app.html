<div class="hr-frame">
  <div class="hr-header">
    <p class="hr-eyebrow">Keka HR</p>
    <h1 class="hr-title">{{ title() }}</h1>
  </div>
  <nav class="hr-tabs" aria-label="Keka HR">
    @for (tab of tabs; track tab.path) {
    <a
      class="hr-tab"
      [routerLink]="tab.path"
      routerLinkActive="hr-tab--active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: tab.exact }"
    >
      <app-icon [name]="tab.icon" [size]="18" />
      {{ tab.label }}
    </a>
    }
  </nav>
  <div class="hr-body">
    <router-outlet />
  </div>
</div>
